<div class="max-w-[420px] mx-auto my-12 px-4">
  <div class="bg-white p-8 sm:p-10 rounded-xl border border-slate-200 shadow-sm">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-900 mb-1">Create New Account</h2>
      <p class="text-sm text-slate-500">
        Already Registered? <a routerLink="/" class="text-emerald-600 hover:text-emerald-700 font-semibold underline">Click here to log in</a>
      </p>
    </div>

    @if (errorMessage) {
      <div class="p-2.5 bg-rose-50 border border-rose-200 text-rose-800 rounded-md text-sm font-medium text-center mb-4">
        {{ errorMessage }}
      </div>
    }

    <form class="space-y-4" (ngSubmit)="onSubmit($event)">
      <div>
        <label for="first-name" class="block text-sm font-bold text-slate-700 mb-1.5">First Name</label>
        <input type="text" id="first-name" name="firstName" autocomplete="given-name" maxlength="20" [(ngModel)]="firstName" (ngModelChange)="clearError()" class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md px-3 text-sm text-slate-900 outline-none transition focus:border-emerald-600 focus:bg-white focus:ring-2 focus:ring-emerald-500/20" />
      </div>

      <div>
        <label for="last-name" class="block text-sm font-bold text-slate-700 mb-1.5">Last Name</label>
        <input type="text" id="last-name" name="lastName" autocomplete="family-name" maxlength="20" [(ngModel)]="lastName" (ngModelChange)="clearError()" class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md px-3 text-sm text-slate-900 outline-none transition focus:border-emerald-600 focus:bg-white focus:ring-2 focus:ring-emerald-500/20" />
      </div>

      <div>
        <label for="dob" class="block text-sm font-bold text-slate-700 mb-1.5">Date of Birth</label>
        <input type="date" id="dob" name="dateOfBirth" autocomplete="bday" min="1900-01-01" [max]="maxDate" [(ngModel)]="dateOfBirth" (ngModelChange)="clearError()" class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md px-3 text-sm text-slate-900 outline-none transition focus:border-emerald-600 focus:bg-white focus:ring-2 focus:ring-emerald-500/20" />
      </div>

      <button type="submit" [disabled]="isSubmitting" class="w-full h-11 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-default text-white font-semibold rounded-md shadow-sm transition cursor-pointer">
        {{ isSubmitting ? 'Creating account…' : 'Sign Up' }}
      </button>
    </form>
  </div>
</div>
