services:
    db:
        image: docker.io/library/postgres:16-alpine
        restart: unless-stopped
        env_file:
            - ".env"
        volumes:
            - postgres_data:/var/lib/postgresql/data:z
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend
        ports:
            - "8000:8000"
        env_file:
            - ".env"
        volumes:
            - ./backend:/app/backend
        working_dir: /app/backend
        environment:
            - PYTHONUNBUFFERED=1
        depends_on:
            db:
                condition: service_healthy

    frontend:
        build:
            context: ./frontend
        ports:
            - "4200:4200"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        depends_on:
            - backend

volumes:
    postgres_data:
