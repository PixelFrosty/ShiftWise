services:
    db:
        image: docker.io/library/postgres:16-alpine
        restart: unless-stopped
        env_file:
            - ".env"
        volumes:
            - postgres_data:/var/lib/postgresql/data:z
        networks:
            - backend_net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend
        ports:
            - "8000:8000"
        env_file:
            - ".env"
        volumes:
            - ./backend:/app/backend
        working_dir: /app/backend
        environment:
            - PYTHONUNBUFFERED=1
        networks:
            - frontend_net
            - backend_net
        depends_on:
            db:
                condition: service_healthy

    frontend:
        build:
            context: ./frontend
        ports:
            - "4200:4200"
        volumes:
            - ./frontend:/app:Z
        networks:
            - frontend_net
        depends_on:
            - backend

    mockoon:
        image: docker.io/mockoon/cli:latest
        command: ["--data", "/data/mockoon-environment.json", "--port", "3000"]
        ports:
            - "3000:3000"
        volumes:
            - ./mockoon-environment.json:/data/mockoon-environment.json:ro,z
        networks:
            - frontend_net

volumes:
    postgres_data:

networks:
    frontend_net:
    backend_net:
