<div class="max-w-[420px] mx-auto my-12 px-4">
  <div class="bg-white p-8 sm:p-10 rounded-xl border border-slate-200 shadow-sm">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-900 mb-1">Welcome Back</h2>
      <p class="text-sm text-slate-500">Sign in to access your scheduling portal</p>
    </div>

    @if (justRegistered) {
    <div
      class="p-2.5 mb-4 bg-brand-50 border border-brand-200 text-brand-800 rounded-md text-sm font-medium text-center">
      Account created! Sign in below.
    </div>
    }

    <form (ngSubmit)="onLogin($event)" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-bold text-slate-700 mb-1.5">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" [(ngModel)]="email"
          (ngModelChange)="clearError()"
          class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md px-3 text-sm text-slate-900 outline-none transition focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-500/20"
          required />
      </div>

      <div>
        <label for="password" class="block text-sm font-bold text-slate-700 mb-1.5">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" [(ngModel)]="password"
          (ngModelChange)="clearError()"
          class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md px-3 text-sm text-slate-900 outline-none transition focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-500/20"
          required />
      </div>

      @if (hasError) {
      <div class="p-2.5 bg-rose-50 border border-rose-200 text-rose-800 rounded-md text-sm font-medium text-center">
        {{ errorMessage }}
      </div>
      }

      <div class="flex flex-col space-y-1.5 text-center text-sm pt-1">
        <p class="text-slate-600 m-0">
          Don't have an account? <a routerLink="/register"
            class="text-brand-600 hover:text-brand-700 font-semibold underline">Click here</a>
        </p>
        <a routerLink="/forgot-password" class="text-slate-600 hover:text-brand-600 underline text-sm">Forgot
          password?</a>
      </div>

      <button type="submit" [disabled]="isSubmitting"
        class="w-full h-11 bg-brand-600 hover:bg-brand-700 disabled:opacity-60 disabled:cursor-default text-white font-semibold rounded-md shadow-sm transition cursor-pointer">
        {{ isSubmitting ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
