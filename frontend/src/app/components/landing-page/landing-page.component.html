<div class="max-w-[420px] mx-auto my-12 px-4">
  <div class="bg-white p-8 sm:p-10 rounded-xl border border-slate-200 shadow-sm">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-900 mb-1">Welcome Back</h2>
      <p class="text-sm text-slate-500">Sign in to access your scheduling portal</p>
    </div>

    @if (justRegistered) {
    <div
      class="p-2.5 mb-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-md text-sm font-medium text-center">
      Account created! Sign in below.
    </div>
    }

    <form (ngSubmit)="onLogin($event)" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-bold text-slate-700 mb-1.5">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" [(ngModel)]="email"
          (ngModelChange)="clearError()"
          class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md px-3 text-sm text-slate-900 outline-none transition focus:border-emerald-600 focus:bg-white focus:ring-2 focus:ring-emerald-500/20"
          required />
      </div>

      <div>
  <label for="password" class="block text-sm font-bold text-slate-700 mb-1.5">Password</label>
  <div class="relative">
    <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" autocomplete="current-password" [(ngModel)]="password"
      (ngModelChange)="clearError()"
      class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md pl-3 pr-10 text-sm text-slate-900 outline-none transition focus:border-emerald-600 focus:bg-white focus:ring-2 focus:ring-emerald-500/20"
      required />
    <button type="button" (click)="togglePassword()"
      class="absolute inset-y-0 right-0 w-10 flex items-center justify-center text-slate-500 hover:text-slate-700 cursor-pointer"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
      @if (showPassword) {
        <!-- eye with slash: password is visible -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        </svg>
      } @else {
        <!-- open eye: password is hidden -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      }
    </button>
  </div>
</div>

      @if (hasError) {
      <div class="p-2.5 bg-rose-50 border border-rose-200 text-rose-800 rounded-md text-sm font-medium text-center">
        {{ errorMessage }}
      </div>
      }

      <div class="flex flex-col space-y-1.5 text-center text-sm pt-1">
        <p class="text-slate-600 m-0">
          Don't have an account? <a routerLink="/register"
            class="text-emerald-600 hover:text-emerald-700 font-semibold underline">Click here</a>
        </p>
        <a routerLink="/forgot-password" class="text-slate-600 hover:text-emerald-600 underline text-sm">Forgot
          password?</a>
      </div>

      <button type="submit" [disabled]="isSubmitting"
        class="w-full h-11 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-default text-white font-semibold rounded-md shadow-sm transition cursor-pointer">
        {{ isSubmitting ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
