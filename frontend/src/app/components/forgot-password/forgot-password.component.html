<header class="navbar">
    <button class="menu-btn" (click)="toggleMenu()" aria-label="Toggle navigation menu">
        <span class="hamburger-icon"></span>
        <span class="hamburger-icon"></span>
        <span class="hamburger-icon"></span>
    </button>

    <h1 class="brand-title">Shiftwise</h1>

    @if (isMenuOpen) {
    <div class="dropdown-menu">
        <a routerLink="/" class="menu-item">Log In</a>
        <a href="#" class="menu-item">About Us</a>
        <a href="#" class="menu-item">Contact</a>
    </div>
    }
</header>

<main class="page-container">
    <div class="card">
        <h2 class="card-title">Forgot Password</h2>

        <p class="card-subtitle">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form class="reset-form" (ngSubmit)="onSubmit($event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-input" />
            </div>

            <button type="submit" class="submit-btn">Send Email</button>
        </form>
    </div>
</main>
