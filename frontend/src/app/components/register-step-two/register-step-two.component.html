<div class="max-w-[420px] mx-auto my-12 px-4">
  <div class="bg-white p-8 sm:p-10 rounded-xl border border-slate-200 shadow-sm">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-900 mb-1">Create New Account</h2>
      <p class="text-sm text-slate-500">
        Already Registered? <a routerLink="/" class="text-brand-600 hover:text-brand-700 font-semibold underline">Click here to log in</a>
      </p>
    </div>

    @if (errorMessage) {
      <div class="p-2.5 bg-rose-50 border border-rose-200 text-rose-800 rounded-md text-sm font-medium text-center mb-4">
        {{ errorMessage }}
      </div>
    }

    <form class="space-y-4" (ngSubmit)="onSubmit($event)">
      <div>
        <label for="first-name" class="block text-sm font-bold text-slate-700 mb-1.5">First Name</label>
        <input type="text" id="first-name" name="firstName" [(ngModel)]="firstName" (ngModelChange)="errorMessage = null"
          class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md px-3 text-sm text-slate-900 outline-none transition focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-500/20"
          required />
      </div>

      <div>
        <label for="last-name" class="block text-sm font-bold text-slate-700 mb-1.5">Last Name</label>
        <input type="text" id="last-name" name="lastName" [(ngModel)]="lastName" (ngModelChange)="errorMessage = null"
          class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md px-3 text-sm text-slate-900 outline-none transition focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-500/20"
          required />
      </div>

      <div class="relative dob-container">
        <label for="dob" class="block text-sm font-bold text-slate-700 mb-1.5">Date of Birth</label>
        <div class="relative flex items-center">
          <input type="text" id="dob" name="dob" [(ngModel)]="dob" (ngModelChange)="onDobInput($event)"
            placeholder="YYYY-MM-DD"
            autocomplete="bday"
            (focus)="openCalendar()"
            class="w-full h-10 bg-slate-50 border border-slate-300 rounded-md pl-3 pr-10 text-sm text-slate-900 outline-none transition focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-500/20"
            required />
          <button type="button" (click)="toggleCalendar($event)" aria-label="Open calendar"
            class="absolute right-2 p-1.5 text-slate-500 hover:text-brand-600 focus:outline-none cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </button>
        </div>

        @if (isCalendarOpen) {
          <div class="absolute left-0 z-30 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-xl p-3 text-slate-800">
            <!-- Calendar Navigation Header -->
            <div class="flex items-center justify-between gap-1 mb-2">
              <button type="button" (click)="prevMonth($event)" class="p-1 rounded hover:bg-slate-100 text-slate-600 cursor-pointer" aria-label="Previous month">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
              </button>

              <div class="flex items-center gap-1.5 flex-1 justify-center">
                <select [ngModel]="calMonth" (ngModelChange)="setCalMonth($event)" [ngModelOptions]="{standalone: true}"
                  class="h-7 text-xs font-semibold bg-slate-50 border border-slate-300 rounded px-1.5 text-slate-800 outline-none focus:border-brand-600 cursor-pointer">
                  @for (m of monthNames; track $index) {
                    <option [value]="$index">{{ m }}</option>
                  }
                </select>

                <select [ngModel]="calYear" (ngModelChange)="setCalYear($event)" [ngModelOptions]="{standalone: true}"
                  class="h-7 text-xs font-semibold bg-slate-50 border border-slate-300 rounded px-1.5 text-slate-800 outline-none focus:border-brand-600 cursor-pointer">
                  @for (y of availableYears; track y) {
                    <option [value]="y">{{ y }}</option>
                  }
                </select>
              </div>

              <button type="button" (click)="nextMonth($event)" class="p-1 rounded hover:bg-slate-100 text-slate-600 cursor-pointer" aria-label="Next month">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              </button>
            </div>

            <!-- Days of Week -->
            <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-slate-400 mb-1">
              <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>

            <!-- Calendar Days Grid -->
            <div class="grid grid-cols-7 gap-1 text-center text-xs">
              @for (cell of calendarCells; track $index) {
                @if (cell.empty) {
                  <div class="h-7 w-7"></div>
                } @else {
                  <button type="button" (click)="selectDay(cell.day, $event)"
                    [class.bg-brand-600]="isSelectedDay(cell.day)"
                    [class.text-white]="isSelectedDay(cell.day)"
                    [class.font-bold]="isSelectedDay(cell.day)"
                    [class.hover:bg-brand-50]="!isSelectedDay(cell.day)"
                    [class.text-slate-700]="!isSelectedDay(cell.day)"
                    class="h-7 w-7 mx-auto flex items-center justify-center rounded-full transition cursor-pointer">
                    {{ cell.day }}
                  </button>
                }
              }
            </div>

            <!-- Footer: Close and Current Selection -->
            <div class="mt-2 pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
              <button type="button" (click)="closeCalendar()" class="text-slate-500 hover:text-slate-700 font-medium cursor-pointer">Close</button>
              @if (dob) {
                <span class="text-brand-600 font-semibold">{{ dob }}</span>
              }
            </div>
          </div>
        }
      </div>

      <button type="submit" [disabled]="isSubmitting"
        class="w-full h-11 bg-brand-600 hover:bg-brand-700 disabled:opacity-60 disabled:cursor-default text-white font-semibold rounded-md shadow-sm transition cursor-pointer">
        {{ isSubmitting ? 'Creating Account…' : 'Complete Registration' }}
      </button>
    </form>
  </div>
</div>
